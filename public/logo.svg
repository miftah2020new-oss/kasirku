      d="M 132 590 
         C 142 520 182 440 268 435 
         C 358 430 432 455 432 520 
         C 432 575 378 620 280 620 
         C 198 620 148 635 132 590 Z"
      fill="#DC00D4"
    />

    <!-- Celah Putih Lengkung (Negative Space di dalam J) -->
    <path
      d="M 152 450 
         C 218 445 282 400 376 435 
         C 420 450 426 475 382 480 
         C 298 490 218 520 162 470 Z"
      fill="#FFFFFF"
    />
  </g>

  <!-- ================= 2. HURUF "F" (Emerald Forest Green #27865C) ================= -->
