      d="M 315 70 
         C 225 120 145 200 118 310 
         C 88 420 102 520 132 590 
         C 118 540 122 450 158 360 
         C 198 260 258 170 322 110 Z"
      fill="#DC00D4"
    />

    <!-- Sirip / Gelembung bulat bawah huruf J -->
