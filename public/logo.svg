<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="100%" height="100%">
  <defs>
    <!-- Filter untuk bayangan halus -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ================= 1. HURUF "J" (Vivid Magenta #DC00D4) ================= -->
  <g id="letter-J">
    <!-- Batang Vertikal Utama Huruf J (Flat top) -->
    <path
      d="M 315 70 
         L 452 70 
         L 452 355 
         C 452 395 410 405 345 370 
         C 290 335 240 340 200 358 
         C 180 310 205 240 255 190 
         C 290 155 320 105 315 70 Z"
      fill="#DC00D4"
    />

    <!-- Sayap lengkung kiri luar huruf J (Melengkung dinamis ke bawah kiri) -->
