         C 638 388 634 408 594 408 
         C 520 408 470 384 458 334 Z"
      fill="#FFFFFF"
    />
  </g>

  <!-- ================= 3. TIGA BINTANG KILAU 4-POINT (Hitam Pekat) ================= -->
  <g id="sparkle-stars" fill="#0A0A0A">
    <!-- Bintang 1: Di pucuk ujung runcing sayap hijau huruf F -->
    <path
      d="M 688 95 
         Q 688 155 742 155 
         Q 688 155 688 215 
         Q 688 155 634 155 
         Q 688 155 688 95 Z"
    />

    <!-- Bintang 2: Di atas huruf 'r' pertama (antara B dan r) -->
